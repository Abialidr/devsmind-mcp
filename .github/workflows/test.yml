name: test

# The path-safety logic (Windows-unsafe names, case collisions, cross-OS path mapping, the repair
# flow) behaves differently per OS and per git build, so it is exercised on all three. Windows is the
# platform it protects; Linux and macOS are where the bad paths originate and where the
# platform-specific branches (e.g. a teammate's /home/... path healed on a Mac) actually run.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The real-git tests commit as a throwaway identity inside temp repos; runners have none set.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npx jest --ci
